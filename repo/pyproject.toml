[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dnam-network-clock"
version = "1.0.0"
description = "Apply the K=60 PCA network-based DNA methylation epigenetic age clock."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Antón Carcedo" },
]
keywords = ["epigenetic clock", "DNA methylation", "biological age", "PCA", "bioinformatics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.20",
    "pandas>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/REPLACE_ME/dnam-network-clock"
Repository = "https://github.com/REPLACE_ME/dnam-network-clock"
Issues = "https://github.com/REPLACE_ME/dnam-network-clock/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dnam_network_clock = ["weights/*.csv", "weights/*.json"]
